[project]
name = "osmsea"
version = "0.1.0"
description = "OSMSEA orchestration runtime"
authors = [
    { name = "Malyaj Nailwal", email = "pyfaith5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "pypdf>=5",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_sandbox: runs code in the real Docker sandbox (skipped when Docker or the image is unavailable)"]
